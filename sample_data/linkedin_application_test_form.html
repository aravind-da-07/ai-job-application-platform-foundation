<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LinkedIn Application Test Form</title>
</head>

<body>

<h1>Application Test Form</h1>

<form id="application-form">

    <label for="field-001">
        First Name
    </label>
    <input
        id="field-001"
        data-field-id="field-001"
        type="text"
    >

    <br><br>

    <label for="field-002">
        Email
    </label>
    <input
        id="field-002"
        data-field-id="field-002"
        type="email"
    >

    <br><br>

    <label for="field-003">
        Phone
    </label>
    <input
        id="field-003"
        data-field-id="field-003"
        type="text"
    >

    <br><br>

    <label for="field-004">
        Location
    </label>
    <input
        id="field-004"
        data-field-id="field-004"
        type="text"
    >

    <br><br>

    <label for="field-005">
        Experience
    </label>
    <input
        id="field-005"
        data-field-id="field-005"
        type="text"
    >

    <br><br>

    <label for="field-006">
        Employment Type
    </label>

    <select
        id="field-006"
        data-field-id="field-006"
    >
        <option value="">Select</option>
        <option value="full-time">Full-time</option>
        <option value="part-time">Part-time</option>
        <option value="contract">Contract</option>
    </select>

    <br><br>

    <label>
        <input
            id="field-007"
            data-field-id="field-007"
            type="checkbox"
        >
        Willing to work remotely
    </label>

    <br><br>

    <label>
        <input
            id="field-008"
            data-field-id="field-008"
            type="radio"
            name="work_mode"
        >
        Remote
    </label>

    <label>
        <input
            id="field-009"
            data-field-id="field-009"
            type="radio"
            name="work_mode"
        >
        Hybrid
    </label>

</form>

</body>
</html>
